RARITY_ORDER = ["전설", "영웅", "희귀", "고급", "일반"]
WON_PER_DIAMOND = 55000 / 4000

current_mode = "의상"

RAW_TOTAL = sum(prob for _, _, prob in SUMMON_DATA)
WEIGHTS = [prob / RAW_TOTAL for _, _, prob in SUMMON_DATA]

counts = Counter()
rarity_counts = Counter()
total_summons = 0
total_diamonds = 0
history = []
auto_mode = None

def change_mode(mode_name):
    global current_mode, SUMMON_DATA, RAW_TOTAL, WEIGHTS
    if auto_mode:
        return
    
    current_mode = mode_name
    reset_all()
    
    if mode_name == "의상":
        SUMMON_DATA = COSTUME_DATA
        mode_label_var.set("현재 모드: 👗 의상 소환")
    else:
        SUMMON_DATA = MOUNT_DATA
        mode_label_var.set("현재 모드: 🐎 탈것 소환")
        
    RAW_TOTAL = sum(prob for _, _, prob in SUMMON_DATA)
    WEIGHTS = [prob / RAW_TOTAL for _, _, prob in SUMMON_DATA]
    
    version_label.config(text=f"확률 데이터 {len(SUMMON_DATA)}종 적용 / 4,000다이아 = 55,000원 기준")
    update_item_list()
    status_var.set(f"{mode_name} 소환 모드로 전환되었습니다.")

def summon_once():
    index = random.choices(range(len(SUMMON_DATA)), weights=WEIGHTS, k=1)[0]
    name, rarity, probability = SUMMON_DATA[index]
    counts[name] += 1
    rarity_counts[rarity] += 1
    return name, rarity, probability

def update_summary():
    total_var.set(f"총 소환 횟수: {total_summons:,}회")
    cost_won = total_diamonds * WON_PER_DIAMOND
    cost_var.set(f"사용 다이아: {total_diamonds:,}개 (약 {cost_won:,.0f}원)")

    for rarity in RARITY_ORDER:
        rarity_vars[rarity].set(f"{rarity}: {rarity_counts[rarity]:,}개")

def execute_summon(amount, diamond_cost):
    global total_summons, total_diamonds, auto_mode
    if auto_mode:
        return

    set_buttons_state("running")
    total_diamonds += diamond_cost
    status_var.set("✨ 찬란한 빛과 함께 소환 카드가 열리는 중입니다...")
    root.update()

    def process_batch():
        global total_summons
        batch_rarity_counts = Counter()
        legend_hero_items = []

        for _ in range(amount):
            name, rarity, probability = summon_once()
            total_summons += 1
            batch_rarity_counts[rarity] += 1
            
            if rarity in ["전설", "영웅"]:
                legend_hero_items.append((rarity, name, f"{probability:.7f}%"))

        display_parts = []
        for r, n, p in legend_hero_items:
            display_parts.append(f"[{r}] {n}")

        for rarity in ["희귀", "고급", "일반"]:
            cnt = batch_rarity_counts[rarity]
            if cnt > 0:
                display_parts.append(f"{rarity} {cnt}개")

        summary_text = ", ".join(display_parts) if display_parts else "하위 등급 소환"
        row = (total_summons, f"{amount}회 소환", summary_text, f"{diamond_cost:,} 다이아")
        history.append(row)

        for item in result_tree.get_children():
            result_tree.delete(item)
        for r_row in reversed(history[-200:]):
            result_tree.insert("", 0, values=r_row)

        if legend_hero_items:
            last_r, last_n, _ = legend_hero_items[-1]
            if last_r == "전설":
                status_var.set(f"🎉 [대박 축하!] 전설 획득 성공: [{last_r}] {last_n}")
            else:
                status_var.set(f"✨ 영웅 등급 획득: [{last_r}] {last_n}")
        else:
            status_var.set(f"최근 {amount}회 소환 완료")

        update_summary()
        update_item_list()
        set_buttons_state("normal")

    root.after(300, process_batch)

def set_buttons_state(state):
    btn_state = "disabled" if state == "running" else "normal"
    btn_1_summon.config(state=btn_state)
    btn_11_summon.config(state=btn_state)
    btn_auto_1.config(state=btn_state)
    btn_auto_11.config(state=btn_state)

    btn_mode_mount.config(state=btn_state)
    btn_analysis.config(state=btn_state)

def run_auto_11():
    global auto_mode
    if auto_mode:

    auto_mode = "11"

    global auto_mode
    if auto_mode:
        auto_mode = None
        set_buttons_state("normal")
        status_var.set("자동 소환이 안전하게 중지되었습니다.")

def reset_all():
    global total_summons, total_diamonds, auto_mode
    auto_mode = None
    set_buttons_state("normal")

    counts.clear()
    rarity_counts.clear()
    history.clear()
    total_summons = 0
    total_diamonds = 0

    for item in result_tree.get_children():
        result_tree.delete(item)

    update_summary()
    update_item_list()
    status_var.set("모든 데이터가 초기화되었습니다.")

def update_item_list():
    for item in item_tree.get_children():
        item_tree.delete(item)

    rarity_groups = {rarity: [] for rarity in RARITY_ORDER}
    for name, rarity, probability in SUMMON_DATA:
        rarity_groups[rarity].append((name, probability))

    for rarity in RARITY_ORDER:
        for name, probability in rarity_groups[rarity]:
            item_tree.insert("", "end", values=(rarity, name, f"{probability:.7f}%", f"{counts[name]:,}"))

def sort_treeview(tree, column, reverse):
    data = [(tree.set(item, column), item) for item in tree.get_children("")]
    def key_func(value):
        val = value[0].replace(",", "")
        try:
            return float(val.replace("%", "").replace("회", "").replace(" 다이아", ""))
        except ValueError:
            return val
    data.sort(key=key_func, reverse=reverse)
    for index, (_, item) in enumerate(data):
        tree.move(item, "", index)
    tree.heading(column, command=lambda: sort_treeview(tree, column, not reverse))

def open_analysis_window():
    analysis_win = tk.Toplevel(root)
    analysis_win.title("💰 현질 금액별 평균 기대값 분석")
    analysis_win.geometry("520x580")
    analysis_win.minsize(460, 520)
    analysis_win.configure(bg=BG_LIGHT)

    tk.Label(analysis_win, text=f"현재 선택된 모드: [{current_mode} 소환]", font=("Malgun Gothic", 12, "bold"), bg=BG_LIGHT, fg=ACCENT_BLUE).pack(pady=(15, 5))
    tk.Label(analysis_win, text="현질 금액을 입력하고 [기대값 계산] 버튼을 누르세요.\n(4,000다이아 = 55,000원 기준 / 1회 = 200다이아)", font=("Malgun Gothic", 9), bg=BG_LIGHT, fg="#64748b").pack(pady=(0, 10))

    input_frame = ttk.Frame(analysis_win)
    input_frame.pack(pady=5)

    tk.Label(input_frame, text="현질 금액 (원):", font=("Malgun Gothic", 10, "bold"), bg=BG_LIGHT).pack(side="left", padx=5)
    
    money_entry = ttk.Entry(input_frame, font=("Malgun Gothic", 11), width=16)
    money_entry.pack(side="left", padx=5)
    money_entry.insert(0, "100000") # 기본 예시 10만 원

    rarity_probs = {r: 0.0 for r in RARITY_ORDER}
    for _, rarity, prob in SUMMON_DATA:
        rarity_probs[rarity] += prob

    result_text_box = tk.Text(analysis_win, font=("Malgun Gothic", 10), bg="#ffffff", fg=FG_DARK, padx=12, pady=12, relief="solid", bd=1)
    result_text_box.pack(fill="both", expand=True, padx=20, pady=10)
    result_text_box.config(state="disabled")

    def calculate_expectation():
        try:
            raw_input = money_entry.get().replace(",", "").strip()
            money_spent = float(raw_input)
        except ValueError:
            result_text_box.config(state="normal")
            result_text_box.delete("1.0", tk.END)
            result_text_box.insert("1.0", "⚠️ 올바른 숫자를 입력해 주세요.")
            result_text_box.config(state="disabled")
            return

        total_dia = money_spent / WON_PER_DIAMOND
        total_pulls = total_dia / 200

        output_lines = []
        output_lines.append(f"💵 입력 금액: {money_spent:,.0f} 원")
        output_lines.append(f"💎 환산 다이아: {total_dia:,.0f}개 (총 소환 가능: 약 {total_pulls:,.1f}회)\n")
        output_lines.append("=" * 44)
        output_lines.append(" [입력 금액 기준 평균 기대 획득 개수]")
        output_lines.append("-" * 44)

        for rarity in RARITY_ORDER:
            p_percent = rarity_probs[rarity]
            prob_ratio = p_percent / 100.0
            
            exp_total = total_pulls * prob_ratio
            actual_count = rarity_counts[rarity]
            
            output_lines.append(f"• [{rarity}] 등급 (확률 {p_percent:.4f}%)")
            line = f"  - 평균 기대 획득량: {exp_total:.2f}개"
            
            if total_summons > 0:
                diff = actual_count - exp_total
                sign = "+" if diff >= 0 else ""
                line += f" (내 실제: {actual_count}개 / 차이: {sign}{diff:.2f})"
            output_lines.append(line)
            output_lines.append("")

        result_text_box.config(state="normal")
        result_text_box.delete("1.0", tk.END)
        result_text_box.insert("1.0", "\n".join(output_lines))
        result_text_box.config(state="disabled")

    calc_btn = ttk.Button(analysis_win, text="🧮 평균 기대값 계산하기", command=calculate_expectation)
    calc_btn.pack(pady=(0, 15))
    
    calculate_expectation()

btn_1_summon = ttk.Button(button_frame, text="1회 소환 (200 다이아)", command=lambda: execute_summon(1, 200))
btn_1_summon.pack(side="left", padx=5, pady=6)

btn_11_summon = ttk.Button(button_frame, text="11회 소환 (2,000 다이아)", command=lambda: execute_summon(11, 2000))
btn_11_summon.pack(side="left", padx=5, pady=6)

btn_auto_1 = ttk.Button(button_frame, text="1회씩 전설까지 자동", command=run_auto_1)
btn_auto_1.pack(side="left", padx=5, pady=6)

btn_auto_11 = ttk.Button(button_frame, text="11회씩 전설까지 자동", command=run_auto_11)
btn_auto_11.pack(side="left", padx=5, pady=6)

ttk.Button(button_frame, text="자동 중지", command=stop_auto_summon).pack(side="left", padx=5, pady=6)
ttk.Button(button_frame, text="전체 초기화", command=reset_all).pack(side="right", padx=5, pady=6)

# 누적 통계 영역
stats_frame = ttk.LabelFrame(main, text=" 누적 통계 & 비용 ")
stats_frame.pack(fill="x", pady=(0, 10), ipadx=8, ipady=6)

stat_left_frame = ttk.Frame(stats_frame)
stat_left_frame.pack(side="top", fill="x", padx=8, pady=4)

total_var = tk.StringVar(value="총 소환 횟수: 0회")
tk.Label(stat_left_frame, textvariable=total_var, font=("Malgun Gothic", 11, "bold"), bg=BG_LIGHT, fg="#0f172a").pack(side="left", padx=(0, 20))

cost_var = tk.StringVar(value="사용 다이아: 0개 (약 0원)")
tk.Label(stat_left_frame, textvariable=cost_var, font=("Malgun Gothic", 11, "bold"), bg=BG_LIGHT, fg="#2563eb").pack(side="left")

stat_right_frame = ttk.Frame(stats_frame)
stat_right_frame.pack(side="top", fill="x", padx=8, pady=(4, 6))

rarity_vars = {}
for rarity in RARITY_ORDER:
    var = tk.StringVar(value=f"{rarity}: 0개")
    rarity_vars[rarity] = var
    tk.Label(stat_right_frame, textvariable=var, font=("Malgun Gothic", 9), bg=BG_LIGHT, fg="#334155").pack(side="left", padx=(0, 18))

# 상태 정보 표시
status_var = tk.StringVar(value="소환 대기 중 (원하는 모드와 방식을 선택하세요)")
status_label = tk.Label(main, textvariable=status_var, anchor="w", font=("Malgun Gothic", 10, "bold"), bg="#f1f5f9", fg="#059669", padx=12, pady=8)
status_label.pack(fill="x", pady=(0, 10))

# 하단 결과 / 확률표 탭
notebook = ttk.Notebook(main)
notebook.pack(fill="both", expand=True)

# 1. 소환 결과 탭
result_frame = ttk.Frame(notebook, padding=4)
notebook.add(result_frame, text="  소환 결과 (요약)  ")

result_scroll_y = ttk.Scrollbar(result_frame, orient="vertical")
result_scroll_y.pack(side="right", fill="y")

result_tree = ttk.Treeview(result_frame, columns=("count", "type", "details", "cost"), show="headings", yscrollcommand=result_scroll_y.set)
result_scroll_y.config(command=result_tree.yview)

result_tree.heading("count", text="누적 회차")
result_tree.heading("type", text="구분")
result_tree.heading("details", text="획득 결과")
result_tree.heading("cost", text="소모 다이아")

result_tree.column("count", width=90, anchor="center")
result_tree.column("type", width=120, anchor="center")
result_tree.column("details", width=610, anchor="w")
result_tree.column("cost", width=130, anchor="center")
result_tree.pack(fill="both", expand=True)

# 2. 전체 확률표 탭
item_frame = ttk.Frame(notebook, padding=4)
notebook.add(item_frame, text="  전체 확률표  ")

item_scroll_y = ttk.Scrollbar(item_frame, orient="vertical")
item_scroll_y.pack(side="right", fill="y")
item_scroll_x = ttk.Scrollbar(item_frame, orient="horizontal")
item_scroll_x.pack(side="bottom", fill="x")

item_tree = ttk.Treeview(item_frame, columns=("rarity", "name", "probability", "count"), show="headings", yscrollcommand=item_scroll_y.set, xscrollcommand=item_scroll_x.set)
item_scroll_y.config(command=item_tree.yview)
item_scroll_x.config(command=item_tree.xview)

item_tree.heading("rarity", text="등급", command=lambda: sort_treeview(item_tree, "rarity", False))
item_tree.heading("name", text="이름", command=lambda: sort_treeview(item_tree, "name", False))
item_tree.heading("probability", text="확률", command=lambda: sort_treeview(item_tree, "probability", False))
item_tree.heading("count", text="획득 횟수", command=lambda: sort_treeview(item_tree, "count", False))

item_tree.column("rarity", width=100, anchor="center")
item_tree.column("name", width=420, anchor="center")
item_tree.column("probability", width=150, anchor="center")
item_tree.column("count", width=120, anchor="center")
item_tree.pack(fill="both", expand=True)

update_summary()
update_item_list()

root.mainloop()
</script>
<script>
(()=>{'use strict';const source=document.getElementById('py-data').textContent;function parse(name){const start=source.indexOf(name+' = [');const end=source.indexOf('\n]',start);const part=source.slice(start,end);return [...part.matchAll(/\("([^"]+)",\s*"([^"]+)",\s*([0-9.]+)\)/g)].map(m=>({name:m[1],rarity:m[2],prob:+m[3]}))}const DATA={의상:parse('COSTUME_DATA'),탈것:parse('MOUNT_DATA')},ORDER=['전설','영웅','희귀','고급','일반'],WON_PER_DIA=99000/7200;const $=x=>document.getElementById(x);let mode='의상',data=DATA[mode],weights=[],counts={},rarityCounts={},total=0,dia=0,history=[],auto=null,tab='history',sort={key:null,desc:false};function setWeights(){let sum=data.reduce((a,x)=>a+x.prob,0),n=0;weights=data.map(x=>(n+=x.prob/sum,n));$('version').textContent=`확률 데이터 ${data.length}종 적용 / 7,200다이아 = 99,000원 기준`}function pick(){let r=Math.random(),i=weights.findIndex(w=>r<w);return data[i<0?data.length-1:i]}function f(n){return Number(n).toLocaleString('ko-KR')}function update(){ $('modeTitle').textContent=`현재 모드: ${mode==='의상'?'👗 의상':'🐎 탈것'} 소환`;$('total').textContent=`총 소환 횟수: ${f(total)}회`;$('cost').textContent=`사용 다이아: ${f(dia)}개 (약 ${f(Math.round(dia*WON_PER_DIA))}원)`;$('rarities').innerHTML=ORDER.map(r=>`<span class="rarity ${r==='전설'?'legend':r==='영웅'?'hero':r==='희귀'?'rare':''}">${r}: ${f(rarityCounts[r]||0)}개</span>`).join('');render()}function setStatus(x){$('status').textContent=x}function reset(){if(auto)return;counts={};rarityCounts={};total=0;dia=0;history=[];setStatus('모든 데이터가 초기화되었습니다.');update()}function change(m){if(auto)return;mode=m;data=DATA[m];reset();setWeights();$('costume').className=m==='의상'?'':'alt';$('mount').className=m==='탈것'?'':'alt';setStatus(`${m} 소환 모드로 전환되었습니다.`)}function one(){let x=pick();counts[x.name]=(counts[x.name]||0)+1;rarityCounts[x.rarity]=(rarityCounts[x.rarity]||0)+1;total++;return x}function summary(items,by){let special=items.filter(x=>x.rarity==='전설'||x.rarity==='영웅').map(x=>`[${x.rarity}] ${x.name}`),low=ORDER.slice(2).filter(r=>by[r]).map(r=>`${r} ${by[r]}개`);return [...special,...low].join(', ')||'하위 등급 소환'}function summon(amount,cost,type){if(auto)return;let items=[],by={};for(let i=0;i<amount;i++){let x=one();items.push(x);by[x.rarity]=(by[x.rarity]||0)+1}dia+=cost;history.push({count:total,type,details:summary(items,by),cost:`${f(cost)} 다이아`});let high=items.filter(x=>x.rarity==='전설'||x.rarity==='영웅').at(-1);setStatus(high?(high.rarity==='전설'?`🎉 [대박 축하!] 전설 획득 성공: [전설] ${high.name}`:`✨ 영웅 등급 획득: [영웅] ${high.name}`):`최근 ${amount}회 소환 완료`);update()}function autoRun(amount,cost){if(auto)return;auto=amount;buttons(true);function step(){if(auto!==amount)return;let items=[],by={},legend=null;for(let i=0;i<amount;i++){let x=one();items.push(x);by[x.rarity]=(by[x.rarity]||0)+1;if(x.rarity==='전설')legend=x}dia+=cost;history.push({count:total,type:`${amount}회 소환 (자동)`,details:summary(items,by),cost:`${f(cost)} 다이아`});if(legend){auto=null;buttons(false);setStatus(`🎉 [자동 중단] 전설 획득 성공! [${legend.name}] (총 ${f(total)}회 소환)`)}else setStatus(`${amount}회 자동 소환 진행 중... (누적 ${f(total)}회)`);update();if(auto)setTimeout(step,amount===1?10:25)}step()}function buttons(dis){['one','eleven','autoOne','autoEleven','costume','mount','analysisBtn'].forEach(id=>$(id).disabled=dis)}function render(){let rows;if(tab==='history'){rows=[...history].slice(-200).reverse();$('table').innerHTML=rows.length?`<table><thead><tr><th>누적 회차</th><th>구분</th><th>획득 결과</th><th>소모 다이아</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="center">${f(x.count)}</td><td>${x.type}</td><td>${x.details}</td><td class="center">${x.cost}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">아직 소환 기록이 없습니다.</div>'}else{rows=data.map(x=>({...x,count:counts[x.name]||0}));if(sort.key)rows.sort((a,b)=>{let v=sort.key==='prob'?a.prob-b.prob:sort.key==='count'?a.count-b.count:a[sort.key].localeCompare(b[sort.key],'ko');return sort.desc?-v:v});$('table').innerHTML=`<table><thead><tr><th data-k="rarity">등급</th><th data-k="name">이름</th><th data-k="prob">확률</th><th data-k="count">획득 횟수</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.rarity}</td><td>${x.name}</td><td class="center">${x.prob.toFixed(7)}%</td><td class="center">${f(x.count)}</td></tr>`).join('')}</tbody></table>`;$('table').querySelectorAll('th[data-k]').forEach(e=>e.onclick=()=>{let k=e.dataset.k;sort.desc=sort.key===k?!sort.desc:false;sort.key=k;render()})}}function analyse(){let won=+$('money').value||0,pulls=(won/WON_PER_DIA)/200,prob={};ORDER.forEach(r=>prob[r]=data.filter(x=>x.rarity===r).reduce((a,x)=>a+x.prob,0));$('analysisResult').textContent=`💵 입력 금액: ${f(won)}원\n💎 환산 다이아: ${f(Math.floor(won/WON_PER_DIA))}개 (약 ${pulls.toFixed(1)}회 소환)\n\n[입력 금액 기준 평균 기대 획득 개수]\n${ORDER.map(r=>`• [${r}] 등급 (확률 ${prob[r].toFixed(4)}%)\n  - 평균 기대 획득량: ${(pulls*prob[r]/100).toFixed(2)}개${total?` (내 실제: ${f(rarityCounts[r]||0)}개)`:''}`).join('\n')}`}document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e));render()});$('costume').onclick=()=>change('의상');$('mount').onclick=()=>change('탈것');$('one').onclick=()=>summon(1,200,'1회 소환');$('eleven').onclick=()=>summon(11,2000,'11회 소환');$('autoOne').onclick=()=>autoRun(1,200);$('autoEleven').onclick=()=>autoRun(11,2000);$('stop').onclick=()=>{if(auto){auto=null;buttons(false);setStatus('자동 소환이 안전하게 중지되었습니다.')}};$('reset').onclick=reset;$('analysisBtn').onclick=()=>{$('analysis').showModal();analyse()};$('closeAnalysis').onclick=()=>$('analysis').close();$('calculate').onclick=analyse;setWeights();update()})();
</script></body></html>
